name: ml-local
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  qwen-image:
    <<: *common
    profiles: ["qwen-image"]
    build:
      context: ./qwen-image
    image: local/ml-qwen-image:1
    init: true
    user: "${QWEN_IMAGE_UID:-${SDXL_UID:-1000}}:${QWEN_IMAGE_GID:-${SDXL_GID:-1000}}"
    stop_grace_period: 75s
    environment:
      CUDA_VISIBLE_DEVICES: ${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}},${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}
      NVIDIA_VISIBLE_DEVICES: ${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}},${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QWEN_IMAGE_VRAM_RESERVE_GIB: ${QWEN_IMAGE_VRAM_RESERVE_GIB:-1.5}
      QWEN_IMAGE_DIT: ${QWEN_IMAGE_DIT:-base}
    gpus: all
    volumes:
      - ./models/qwen-image-2.1:/models:ro
      - ./outputs/qwen-image:/data
    ports:
      - "127.0.0.1:8083:8188"
    # agent-uc: images-uc (Open WebUI's image generation) reaches it too; the bot is not on that network.
    networks: [default, agent-uc]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 120s
      retries: 4
  qwen-image-uc:
    <<: *common
    profiles: ["qwen-image-uc"]
    build:
      context: ./qwen-image-uc
      additional_contexts:
        qwenimage: ./qwen-image
    image: local/ml-qwen-image-uc:1
    init: true
    user: "${QWEN_IMAGE_UID:-${SDXL_UID:-1000}}:${QWEN_IMAGE_GID:-${SDXL_GID:-1000}}"
    stop_grace_period: 75s
    environment:
      # QWEN_IMAGE_UC_SHARED=1 (make uc-bonsai): text encoder on the second GPU instead of the CPU and fixed
      # VRAM caps on both GPUs, so bonsai-mtp fits next to it. See QWEN-IMAGE-UC-RU.md.
      CUDA_VISIBLE_DEVICES: ${QWEN_IMAGE_UC_GPU:-${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}}}${QWEN_IMAGE_UC_SHARED:+,${QWEN_IMAGE_UC_ENCODER_GPU:-${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}}}
      NVIDIA_VISIBLE_DEVICES: ${QWEN_IMAGE_UC_GPU:-${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}}}${QWEN_IMAGE_UC_SHARED:+,${QWEN_IMAGE_UC_ENCODER_GPU:-${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}}}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QWEN_IMAGE_UC_VRAM_RESERVE_GIB: ${QWEN_IMAGE_UC_VRAM_RESERVE_GIB:-1.5}
      QWEN_IMAGE_UC_ENCODER_DEVICE: ${QWEN_IMAGE_UC_SHARED:+gpu}
      QWEN_IMAGE_UC_VRAM_GIB: ${QWEN_IMAGE_UC_SHARED:+${QWEN_IMAGE_UC_VRAM_GIB:-7.25}}
      QWEN_IMAGE_UC_ENCODER_VRAM_GIB: ${QWEN_IMAGE_UC_ENCODER_VRAM_GIB:-7.75}
    gpus: all
    # Own network only: other services (the Telegram bot included) cannot resolve or reach it.
    networks: [qwen-image-uc]
    volumes:
      - ./models/qwen-image-2.1-uc:/models:ro
      - ./outputs/qwen-image-uc:/data
    ports:
      - "127.0.0.1:8085:8188"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 120s
      retries: 4
  tgbot:
    <<: *common
    build:
      context: ./tgbot
    image: local/ml-tgbot:1
    init: true
    user: "${TGBOT_UID:-${SDXL_UID:-1000}}:${TGBOT_GID:-${SDXL_GID:-1000}}"
    environment:
      TGBOT_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      TGBOT_TOKEN: ${TGBOT_TOKEN:-}
      TGBOT_ADMINS: ${TGBOT_ADMINS:-}
      # Point the bot at the torrent service; set TGBOT_TORRENT_URL= in .env to disable /magnet.
      TGBOT_TORRENT_URL: ${TGBOT_TORRENT_URL:-http://torrent:8080}
      # Outlives TORRENT_METADATA_TIMEOUT on the torrent side; see torrents.py.
      TGBOT_TORRENT_METADATA_TIMEOUT: ${TGBOT_TORRENT_METADATA_TIMEOUT:-240}
      # Point the bot at the market scraper; set TGBOT_SCRAPER_URL= in .env to disable /query, /watch, ...
      TGBOT_SCRAPER_URL: ${TGBOT_SCRAPER_URL:-http://scraper:8080}
    volumes:
      - ./outputs/tgbot:/data
      - ./qwen-image/workflows:/workflows:ro
    ports:
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  scraper:
    <<: *common
    build:
      context: ./scraper
    image: local/ml-scraper:1
    init: true
    user: "${SCRAPER_UID:-${SDXL_UID:-1000}}:${SCRAPER_GID:-${SDXL_GID:-1000}}"
    environment:
      # One admin key for the whole stack: it guards both the scraper API and tgbot /api/notify.
      SCRAPER_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      SCRAPER_TGBOT_URL: http://tgbot:8080
      SCRAPER_INTERVAL: ${SCRAPER_INTERVAL:-900}
      SCRAPER_DELAY: ${SCRAPER_DELAY:-1.0}
      SCRAPER_REPORT_HOUR: ${SCRAPER_REPORT_HOUR:-10}
    volumes:
      - ./outputs/scraper:/data
    ports:
      - "127.0.0.1:8086:8080"
    depends_on: [tgbot]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  torrent:
    <<: *common
    build:
      context: ./torrent
    image: local/ml-torrent:1
    init: true
    user: "${TORRENT_UID:-${SDXL_UID:-1000}}:${TORRENT_GID:-${SDXL_GID:-1000}}"
    environment:
      # The single admin key guards the torrent API; the service uses it to push to tgbot too.
      TORRENT_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      TORRENT_TGBOT_URL: http://tgbot:8080
      TORRENT_DESTINATION: /data/downloads
      TORRENT_METADATA_TIMEOUT: ${TORRENT_METADATA_TIMEOUT:-180}
    volumes:
      - ./outputs/torrent:/data
    ports:
      - "127.0.0.1:8087:8080"
    depends_on: [tgbot]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  # Image generation for agents: MCP tool generate_image (/mcp) and OpenAI /v1/images/generations
  # over whichever of sdxl / qwen-image is running. No GPU of its own. See agent/README-RU.md.
  images:
    <<: *common
    profiles: ["agent"]
    build:
      context: ./images
      additional_contexts:
        tgbot: ./tgbot
    image: local/ml-images:1
    init: true
    user: "${IMAGES_UID:-${SDXL_UID:-1000}}:${IMAGES_GID:-${SDXL_GID:-1000}}"
    environment:
      IMAGES_API_KEY: ${TGBOT_ADMIN_KEY:-}
      IMAGES_BACKENDS: '{"sdxl": "http://sdxl:8080", "qwen-image": "http://qwen-image:8188"}'
    volumes:
      - ./qwen-image/workflows:/workflows:ro
    ports:
      - "127.0.0.1:8088:8080"
    # Stopped generators are unknown names to Docker DNS; fail fast instead of 6-8 s per probe.
    dns_opt: ["timeout:1", "attempts:1"]
    healthcheck: &images-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 4
  # Open WebUI's image generation (Image button, built-in generate_image, MCP "Images UC"): sdxl,
  # qwen-image and qwen-image-uc, first running wins. Only Open WebUI (network agent-uc) can reach it,
  # the bot cannot.
  images-uc:
    <<: *common
    profiles: ["agent"]
    build:
      context: ./images
      additional_contexts:
        tgbot: ./tgbot
    image: local/ml-images:1
    init: true
    user: "${IMAGES_UID:-${SDXL_UID:-1000}}:${IMAGES_GID:-${SDXL_GID:-1000}}"
    environment:
      IMAGES_NAME: images-uc
      IMAGES_API_KEY: ${TGBOT_ADMIN_KEY:-}
      IMAGES_BACKENDS: >-
        {"sdxl": "http://sdxl:8080", "qwen-image": "http://qwen-image:8188", "qwen-image-uc": "http://qwen-image-uc:8188"}
      # An absolute workflow path: qwen-image's workflows are in /workflows, the uc one is not.
      IMAGES_WORKFLOWS: '{"qwen-image-uc": "/workflows-uc/qwen-image21-uc"}'
    volumes:
      - ./qwen-image/workflows:/workflows:ro
      - ./qwen-image-uc/workflows:/workflows-uc:ro
    networks: [qwen-image-uc, agent-uc]
    dns_opt: ["timeout:1", "attempts:1"]
    healthcheck: *images-health
  # Open WebUI on the LAN (:1098): chats with the local LLMs, skills, MCP image tools, terminal.
  agent-webui:
    <<: *common
    profiles: ["agent"]
    image: ${AGENT_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.4}
    stop_grace_period: 20s
    command: ["bash", "-c", "cp /opt/agent/webui/loader.js /opt/agent/webui/custom.css /app/build/static/ && exec bash start.sh"]
    environment:
      WEBUI_NAME: ${AGENT_WEBUI_NAME:-Local Agent}
      WEBUI_SECRET_KEY: ${AGENT_SECRET_KEY:-}
      WEBUI_ADMIN_EMAIL: ${AGENT_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${AGENT_ADMIN_PASSWORD:-}
      ENABLE_SIGNUP: 'false'
      # Settings below seed the database on first start; later changes in the admin UI win.
      # AGENT_RESET_CONFIG=true make agent re-applies them (and drops UI-made admin settings).
      RESET_CONFIG_ON_START: ${AGENT_RESET_CONFIG:-false}
      ENABLE_OLLAMA_API: 'false'
      # The in-browser Pyodide interpreter has its own fake file system; code runs in the terminal instead.
      ENABLE_CODE_INTERPRETER: 'false'
      # Every LLM of the stack; only the running one answers (the models are mutually exclusive).
      # The same three through billion-context, as bili.<model>; the "Billion context" chat toggle switches to them.
      # strata and bili.strata (indexes 6, 7) are appended last so the bili prefix indexes 3-5 stay put.
      # Indexes 8-11: the four through Headroom, as hr.<model>; the "Headroom" chat toggle switches to them.
      # Indexes 12-15: Headroom in front of billion-context, as hb.<model>, for both toggles on.
      # One headroom serves all four: the x-headroom-base-url header picks the upstream, and the model
      # lists are static because headroom's /v1/models ignores that header.
      OPENAI_API_BASE_URLS: >-
        http://qwen:8080/v1;http://qwen-mtp:8080/v1;http://bonsai-mtp:8080/v1;http://bili:8787/bili/http://qwen:8080/v1;http://bili:8787/bili/http://qwen-mtp:8080/v1;http://bili:8787/bili/http://bonsai-mtp:8080/v1;http://strata:8080/v1;http://bili:8787/bili/http://strata:8080/v1;http://headroom:8787/v1;http://headroom:8787/v1;http://headroom:8787/v1;http://headroom:8787/v1;http://headroom:8787/v1;http://headroom:8787/v1;http://headroom:8787/v1;http://headroom:8787/v1
      OPENAI_API_KEYS: local;local;local;local;local;local;local;local;local;local;local;local;local;local;local;local
      OPENAI_API_CONFIGS: >-
        {"3": {"prefix_id": "bili"}, "4": {"prefix_id": "bili"}, "5": {"prefix_id": "bili"}, "7": {"prefix_id": "bili"},
         "8": {"prefix_id": "hr", "model_ids": ["qwen3.8-27b"], "headers": {"x-headroom-base-url": "http://qwen:8080"}},
         "9": {"prefix_id": "hr", "model_ids": ["qwen3.8-27b-mtp"], "headers": {"x-headroom-base-url": "http://qwen-mtp:8080"}},
         "10": {"prefix_id": "hr", "model_ids": ["bonsai2-27b-uc-mtp"], "headers": {"x-headroom-base-url": "http://bonsai-mtp:8080"}},
         "11": {"prefix_id": "hr", "model_ids": ["qwen3.8-flash-next-iq2_xs"], "headers": {"x-headroom-base-url": "http://strata:8080"}},
         "12": {"prefix_id": "hb", "model_ids": ["qwen3.8-27b"], "headers": {"x-headroom-base-url": "http://bili:8787/bili/http://qwen:8080"}},
         "13": {"prefix_id": "hb", "model_ids": ["qwen3.8-27b-mtp"], "headers": {"x-headroom-base-url": "http://bili:8787/bili/http://qwen-mtp:8080"}},
         "14": {"prefix_id": "hb", "model_ids": ["bonsai2-27b-uc-mtp"], "headers": {"x-headroom-base-url": "http://bili:8787/bili/http://bonsai-mtp:8080"}},
         "15": {"prefix_id": "hb", "model_ids": ["qwen3.8-flash-next-iq2_xs"], "headers": {"x-headroom-base-url": "http://bili:8787/bili/http://strata:8080"}}}
      # Built-in tool categories without a chat toggle are sent with every request (~10K tokens of schemas).
      # Off for all models; a model can turn one back on in Workspace > Models > Builtin Tools. The rest
      # (memory, web search, image generation, code interpreter, chat files, skills) follow the chat's toggles.
      # defaultFilterIds: the Headroom toggle starts on in new chats (CTX-BENCH-RU.md); Billion context stays off.
      # defaultFeatureIds []: Image (and web search, code interpreter) start off; without the key the chat keeps
      # whatever state the toggles had before.
      DEFAULT_MODEL_METADATA: >-
        {"builtinTools": {"time": false, "user_input": false, "knowledge": false, "chats": false, "notes": false,
         "channels": false, "tasks": false, "automations": false, "calendar": false, "notifications": false,
         "subagents": false}, "defaultFilterIds": ["headroom"], "defaultFeatureIds": []}
      ENABLE_IMAGE_GENERATION: 'true'
      IMAGE_GENERATION_ENGINE: openai
      IMAGES_OPENAI_API_BASE_URL: http://images-uc:8080/v1
      IMAGES_OPENAI_API_KEY: ${TGBOT_ADMIN_KEY:-}
      IMAGE_GENERATION_MODEL: auto
      IMAGE_SIZE: 1024x1024
      # No access_grants: admin-only. Grant groups/users in Admin > Settings > External Tools.
      TOOL_SERVER_CONNECTIONS: >-
        [{"type": "mcp", "url": "http://images:8080/mcp", "path": "", "auth_type": "bearer",
          "key": "${TGBOT_ADMIN_KEY:-}", "config": {"enable": true},
          "info": {"id": "images", "name": "Images", "description": "SDXL / Qwen-Image"}},
         {"type": "mcp", "url": "http://images-uc:8080/mcp", "path": "", "auth_type": "bearer",
          "key": "${TGBOT_ADMIN_KEY:-}", "config": {"enable": true},
          "info": {"id": "images-uc", "name": "Images UC", "description": "SDXL / Qwen-Image / Qwen-Image Uncensored"}},
         {"type": "mcp", "url": "http://blender-mcp:8080/mcp", "path": "", "auth_type": "bearer",
          "key": "${TGBOT_ADMIN_KEY:-}", "config": {"enable": true},
          "info": {"id": "blender", "name": "Blender", "description": "Blender on Windows (blender-mcp)"}}]
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id": "terminal", "name": "Terminal", "url": "http://agent-terminal:8000", "auth_type": "bearer",
          "key": "${AGENT_TERMINAL_KEY:-}", "enabled": true, "config": {}}]
      SCARF_NO_ANALYTICS: 'true'
      DO_NOT_TRACK: 'true'
      ANONYMIZED_TELEMETRY: 'false'
    volumes:
      - ./outputs/agent/webui:/app/backend/data
      - ./agent/functions:/opt/agent/functions:ro
      # loader.js / custom.css: Open WebUI's custom script and style hooks (context ring, per-message stats).
      # A directory mount, copied in at start: single-file bind mounts break when an editor replaces the file.
      - ./agent/webui:/opt/agent/webui:ro
    ports:
      - "${AGENT_BIND:-0.0.0.0}:1098:8080"
    networks: [default, agent, agent-uc]
    # Stopped models' service names are unknown to Docker DNS, and the upstream resolver takes 6-8 s
    # to say so; that delay would hit every model list refresh.
    dns_opt: ["timeout:1", "attempts:1"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 4
  # blender-mcp (mcp-for-blender) over streamable HTTP: drives Blender on Windows, where the addon
  # listens on localhost:9876 (Docker Desktop forwards host.docker.internal to the Windows loopback).
  # Telemetry is off, see agent/blender-mcp/run.py. Install the addon: make blender-addon.
  blender-mcp:
    <<: *common
    profiles: ["agent"]
    build:
      context: ./agent/blender-mcp
    image: local/ml-blender-mcp:1
    init: true
    environment:
      BLENDER_MCP_API_KEY: ${TGBOT_ADMIN_KEY:-}
      BLENDER_HOST: ${BLENDER_HOST:-host.docker.internal}
      BLENDER_PORT: ${BLENDER_PORT:-9876}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [agent]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 4
  # billion-context: context-compression proxy in front of the LLMs (http://bili:8787/bili/<upstream>).
  # Open WebUI routes a chat through it while the "Billion context" toggle is on. Pinned version,
  # never self-updates: --no-auto-update in the image entrypoint plus the env/config switches below.
  bili:
    <<: *common
    profiles: ["agent"]
    build:
      context: ./agent/bili
    image: local/ml-bili:1
    init: true
    environment:
      BILI_CONFIG_FILE: /etc/billion-context.json
      BILI_TUNNEL_ALLOWED_HOSTS: qwen:8080,qwen-mtp:8080,bonsai-mtp:8080,strata:8080
      ACP_AUTO_UPDATE: '0'
      BILI_ADVISORY_CHECK: '0'
    volumes:
      - ./agent/bili/billion-context.json:/etc/billion-context.json:ro
      - ./outputs/agent/bili:/data
    networks: [default]
    dns_opt: ["timeout:1", "attempts:1"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/__bili/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 4
  # Headroom: compresses tool outputs, logs, JSON and code in the prompt before it reaches the LLM
  # (http://headroom:8787/v1, upstream from the x-headroom-base-url header). Open WebUI routes a chat
  # through it while the "Headroom" toggle is on, independently of Billion context. Pinned version,
  # telemetry and update checks off (image env). Published on 127.0.0.1:8091 only, for pi / opencode on the
  # host (they send x-headroom-base-url themselves); the unauthenticated bind is acknowledged.
  headroom:
    <<: *common
    profiles: ["agent"]
    build:
      context: ./agent/headroom
    image: local/ml-headroom:1
    init: true
    environment:
      # bili: the hb.<model> chain (headroom -> billion-context -> model).
      HEADROOM_ALLOWED_BASE_URLS: http://qwen:8080,http://qwen-mtp:8080,http://bonsai-mtp:8080,http://strata:8080,http://bili:8787
      HEADROOM_ALLOW_UNAUTHENTICATED_BIND: '1'
      # Fallback upstream for requests without the header (and for /v1/models).
      OPENAI_TARGET_API_URL: http://qwen-mtp:8080
      # Real windows (unknown models default to 128K). Names as Open WebUI and pi / opencode send them.
      HEADROOM_MODEL_LIMITS: >-
        {"openai": {"context_limits": {"qwen3.8-27b": 196608, "qwen3.8-27b-mtp": 163840,
        "qwen3.8-27b-uc-mtp": 163840, "bonsai2-27b-uc-mtp": 262144, "bonsai-27b-uc-mtp": 262144,
        "qwen3.8-flash-next-iq2_xs": 131072}}}
    volumes:
      - ./outputs/agent/headroom:/data
    ports:
      - 127.0.0.1:8091:8787
    networks: [default]
    dns_opt: ["timeout:1", "attempts:1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 4
  # Open Terminal: the agent's shell and file system, plus the host's agent skills (read-only).
  agent-terminal:
    <<: *common
    profiles: ["agent"]
    image: ${AGENT_TERMINAL_IMAGE:-ghcr.io/open-webui/open-terminal:0.14.0}
    # Link Claude Code / pi / opencode skills into ~/.cptr/skills, then the image's own entrypoint.
    entrypoint: ["/usr/bin/tini", "--", "sh", "-c", "python3 /opt/agent/sync_skills.py; exec /app/entrypoint.sh run"]
    stop_grace_period: 10s
    # The host's Docker daemon (socket below). The socket is root-equivalent on the host: whoever can chat
    # with a terminal-enabled model in Open WebUI can run anything there. GID from the socket (Makefile).
    group_add: ["${AGENT_DOCKER_GID:-0}"]
    environment:
      OPEN_TERMINAL_API_KEY: ${AGENT_TERMINAL_KEY:-}
      HOST_HOME: ${HOME}
      OPEN_TERMINAL_INFO: >-
        Projects live in ~/projects (the host's ${AGENT_PROJECTS:-${HOME}/mlstuff/projects}, read-write; changes are
        real). Work inside a project directory and read its AGENTS.md / CLAUDE.md / README first.
        Ports 7070-7079 are published to the LAN: run dev servers on 0.0.0.0 with one of them.
        The host's Docker daemon is available (docker, docker compose). It resolves bind mounts on the host, so
        run docker / docker compose for a project from ${AGENT_PROJECTS:-${HOME}/mlstuff/projects}/<project>
        (the same files as ~/projects/<project>), not from ~/projects. Containers it starts are real host
        containers: do not stop or remove ones you did not create.
    # Dev servers the agent starts in the terminal (bind 0.0.0.0 inside the container).
    ports:
      - "${AGENT_BIND:-0.0.0.0}:7070-7079:7070-7079"
    volumes:
      - ./outputs/agent/terminal:/home/user
      # The host's projects, read-write, so the agent edits them in place.
      - ${AGENT_PROJECTS:-${HOME}/mlstuff/projects}:/home/user/projects
      # The same projects at their host path, so bind mounts in their compose files resolve via the socket.
      - ${AGENT_PROJECTS:-${HOME}/mlstuff/projects}:${AGENT_PROJECTS:-${HOME}/mlstuff/projects}
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agent/sync_skills.py:/opt/agent/sync_skills.py:ro
      # make agent creates the skill directories that do not exist yet.
      - ${HOME}/.claude/skills:/mnt/skills/claude:ro
      - ${HOME}/.claude/plugins/cache:/mnt/skills/claude-plugins:ro
      - ${HOME}/.claude/plugins/installed_plugins.json:/mnt/skills/claude-plugins.json:ro
      - ${HOME}/.agents/skills:/mnt/skills/agents:ro
      - ${HOME}/.config/opencode/skills:/mnt/skills/opencode:ro
      - ${HOME}/.pi/skills:/mnt/skills/pi:ro
      - ${HOME}/.pi/agent/skills:/mnt/skills/pi-agent:ro
      - ${HOME}/.pi/agent/npm/node_modules:/mnt/skills/pi-packages:ro
      - ${HOME}/.pi/agent/settings.json:/mnt/skills/pi-settings.json:ro
    networks: [agent]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
  sdxl:
    <<: *common
    profiles: ["sdxl"]
    build:
      context: ./sdxl
      args:
        SDXL_BASE_IMAGE: ${SDXL_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime@sha256:c16f4c749e2d9e96878875cdf6cc45cddda1d1a36fddd371dd6f2360f1b6e2a2}
    image: local/ml-sdxl:1
    init: true
    user: "${SDXL_UID:-1000}:${SDXL_GID:-1000}"
    stop_grace_period: 75s
    environment:
      SDXL_MODE: single
      CUDA_VISIBLE_DEVICES: ${SDXL_GPU0:-0}
      NVIDIA_VISIBLE_DEVICES: ${SDXL_GPU0:-0}
      SDXL_QUEUE_SIZE: ${SDXL_QUEUE_SIZE:-4}
      SDXL_MAX_RESULTS: ${SDXL_MAX_RESULTS:-100}
      SDXL_RETENTION_HOURS: ${SDXL_RETENTION_HOURS:-168}
      SDXL_VAE_TILING: ${SDXL_VAE_TILING:-1}
      SDXL_VRAM_RESERVE_GIB: ${SDXL_VRAM_RESERVE_GIB:-1.5}
      SDXL_GPU0_BUDGET: ${SDXL_GPU0_BUDGET:-11GiB}
      SDXL_GPU1_BUDGET: ${SDXL_GPU1_BUDGET:-9GiB}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SDXL_GPU0:-0}"]
              capabilities: [gpu]
    volumes:
      - ./models/sdxl-base-1.0:/models:ro
      - ./outputs/sdxl:/outputs
    ports:
      - "127.0.0.1:8082:8080"
    # agent-uc: images-uc (Open WebUI's image generation) reaches it too; the bot is not on that network.
    networks: [default, agent-uc]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 180s
      retries: 4
  qwen:
    <<: *common
    profiles: ["qwen"]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1}
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8080:8080
    command:
      - --model
      - /models/${QWEN_MODEL_FILE:-Qwen3.8-27B-UD-Q4_K_M.gguf}
      - --alias
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --device
      - CUDA0,CUDA1
      - --gpu-layers
      - all
      - --override-tensor
      - 'token_embd\.weight=CUDA0'
      - --fit
      - 'off'
      - --split-mode
      - layer
      - --tensor-split
      - ${QWEN_TENSOR_SPLIT:-0.60,0.40}
      - --ctx-size
      - ${QWEN_CTX_SIZE:-196608}
      # The model file carries an MTP head (blk.64.nextn): lossless speculative decoding.
      - --spec-type
      - ${QWEN_SPEC_TYPE:-draft-mtp}
      - --spec-draft-n-max
      - ${QWEN_SPEC_DRAFT_N_MAX:-2}
      - --parallel
      - '1'
      - --flash-attn
      - 'on'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-type-k-draft
      - q8_0
      - --cache-type-v-draft
      - q8_0
      # Host-RAM prompt cache and recurrent-state checkpoints: a diverged history
      # resumes from the nearest checkpoint instead of a full prefill.
      - --cache-ram
      - ${QWEN_CACHE_RAM:-4096}
      - --ctx-checkpoints
      - ${QWEN_CTX_CHECKPOINTS:-8}
      - --batch-size
      - '2048'
      - --ubatch-size
      - ${QWEN_UBATCH_SIZE:-256}
      - --threads
      - '4'
      - --poll
      - '0'
      - --jinja
      - --metrics
      - --sleep-idle-seconds
      - '-1'
  qwen-mtp:
    # Same model class as qwen, but the RVN Q4_K_M multilingual build with the
    # embedded MTP head (speculative decoding). Uses its own QWEN_MTP_* variables;
    # tuned like qwen, fully in VRAM with MTP on, ~1 GiB headroom per GPU.
    <<: *common
    profiles: ["qwen-mtp"]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${QWEN_MTP_CUDA_VISIBLE_DEVICES:-${CUDA_VISIBLE_DEVICES:-0,1}}
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8081:8080
    command:
      - --model
      - /models/${QWEN_MTP_MODEL_FILE:-RVN-Q4_K_M-multilingual-mtp.gguf}
      - --alias
      - qwen3.8-27b-mtp
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --device
      - CUDA0,CUDA1
      - --gpu-layers
      - all
      - --override-tensor
      - 'token_embd\.weight=CUDA0'
      - --fit
      - 'off'
      - --split-mode
      - layer
      - --tensor-split
      - ${QWEN_MTP_TENSOR_SPLIT:-0.60,0.40}
      - --ctx-size
      - ${QWEN_MTP_CTX_SIZE:-163840}
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - ${QWEN_MTP_SPEC_DRAFT_N_MAX:-2}
      - --parallel
      - '1'
      - --flash-attn
      - 'on'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-type-k-draft
      - q8_0
      - --cache-type-v-draft
      - q8_0
      # Host-RAM prompt cache and recurrent-state checkpoints, as in qwen.
      - --cache-ram
      - ${QWEN_MTP_CACHE_RAM:-4096}
      - --ctx-checkpoints
      - ${QWEN_MTP_CTX_CHECKPOINTS:-8}
      - --batch-size
      - '2048'
      - --ubatch-size
      - ${QWEN_MTP_UBATCH_SIZE:-256}
      - --threads
      - '4'
      - --poll
      - '0'
      - --jinja
      - --metrics
      - --sleep-idle-seconds
      - '-1'
  bonsai-mtp:
    # Ternary-Bonsai-2-27B Uncensored (qwen35 hybrid, PQ2_0 ternary + MTP head).
    # Needs the PrismML llama.cpp fork, so it has its own image; see bonsai/Dockerfile.
    # ~8.1 GB of weights leave room for the native 256k context shared by all slots
    # (--kv-unified). Measured on 4070 Ti S + 3080 Ti: MTP n-max 2 beats 3 and 4;
    # 0.6,0.4 keeps >=1.2 GB free per GPU even with 4 slots; ubatch 1024 does not fit
    # at 256k. Single 3080 Ti is faster (BONSAI_MTP_CUDA_VISIBLE_DEVICES=1,
    # BONSAI_MTP_DEVICE=CUDA0, BONSAI_MTP_CTX_SIZE=65536, BONSAI_MTP_PARALLEL=1).
    <<: *common
    profiles: ["bonsai-mtp"]
    build:
      context: ./bonsai
    image: local/ml-bonsai:1
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${BONSAI_MTP_CUDA_VISIBLE_DEVICES:-${CUDA_VISIBLE_DEVICES:-0,1}}
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8089:8080
    command:
      - --model
      - /models/${BONSAI_MTP_MODEL_FILE:-Ternary-Bonsai-2-27B-Uncensored-Gaston-PQ2_0-MTP.gguf}
      - --alias
      - bonsai2-27b-uc-mtp
      - --device
      - ${BONSAI_MTP_DEVICE:-CUDA0,CUDA1}
      - --gpu-layers
      - all
      - --override-tensor
      - 'token_embd\.weight=CUDA0'
      - --fit
      - 'off'
      - --split-mode
      - layer
      - --tensor-split
      - ${BONSAI_MTP_TENSOR_SPLIT:-0.6,0.4}
      - --ctx-size
      - ${BONSAI_MTP_CTX_SIZE:-262144}
      - --parallel
      - ${BONSAI_MTP_PARALLEL:-2}
      - --kv-unified
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - ${BONSAI_MTP_SPEC_DRAFT_N_MAX:-2}
      - --flash-attn
      - 'on'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-type-k-draft
      - q8_0
      - --cache-type-v-draft
      - q8_0
      - --cache-ram
      - ${BONSAI_MTP_CACHE_RAM:-4096}
      - --ctx-checkpoints
      - ${BONSAI_MTP_CTX_CHECKPOINTS:-8}
      - --batch-size
      - '2048'
      - --ubatch-size
      - ${BONSAI_MTP_UBATCH_SIZE:-512}
      - --threads
      - '4'
      - --poll
      - '0'
      - --jinja
      - --metrics
      - --sleep-idle-seconds
      - '-1'
  strata:
    # Qwen3.8-Flash-Next 125B MoE on the Strata engine (github.com/Niko1221/Strata, source in
    # ./strata/src, see STRATA-PLAN-RU.md), IQ2_XS. Experts live in RAM (~35.5 GB), hot experts are
    # cached in VRAM of both GPUs (layer split). WSL2: only 8 GiB of the expert arena is pinned,
    # KV stays in VRAM (no KV streaming). The first start downloads ~76 GB into ./models/strata.
    # Settings are written to ./models/strata/config/strata-iq2_xs.json on the first start;
    # STRATA_REINSTALL=1 re-runs the setup with the env below.
    <<: *common
    profiles: ["strata"]
    build:
      context: ./strata/src
      args:
        CUDA_ARCHITECTURES: "86;89"
        BUILD_VISION: "0"
    image: local/strata:0.1.39
    gpus: all
    ipc: host
    ulimits:
      memlock: -1
    environment:
      FAMILY: qwen
      MODEL: ${STRATA_MODEL:-IQ2_XS}
      CONTEXT: ${STRATA_CONTEXT:-131072}
      VISION: "no"
      KV: ${STRATA_KV:-int8}
      GPUS: ${STRATA_GPUS:-0,1}
      LAYER_SPLIT: ${STRATA_LAYER_SPLIT:-}
      # setup.py reads the RAM of the WSL VM from /proc/meminfo; the container has no memory limit.
      LOW_RAM: "off"
      REINSTALL: ${STRATA_REINSTALL:-0}
      # DNS rebinding check: without an API key the server answers only to localhost/IPs; Open WebUI and the bot
      # reach it as http://strata:8080.
      STRATA_ALLOWED_HOSTS: strata
      # Opt-in engine knobs (STRATA-PLAN-RU.md, step 6). Empty means unset; SPLIT_OWN=0 is its default.
      STRATA_STAGE_TRIM: ${STRATA_STAGE_TRIM:-}
      STRATA_PREFILL_HELP: ${STRATA_PREFILL_HELP:-}
      STRATA_SPLIT_OWN: ${STRATA_SPLIT_OWN:-0}
      STRATA_ARENA_PIN_GIB: ${STRATA_ARENA_PIN_GIB:-}
    volumes:
      - ./models/strata:/data
      # Server-wide defaults for what a request leaves out (POST /settings, the web page's "share with other
      # apps"): reasoning_effort low, so bili's summaries and Open WebUI's title/tags calls do not think for
      # minutes; Open WebUI chats ask for high themselves. Strata keeps the file next to its config in /opt/strata.
      - ./models/strata/config/strata-iq2_xs.shared-settings.json:/opt/strata/strata-iq2_xs.shared-settings.json
    ports:
      - 127.0.0.1:8090:8080
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      # the first start downloads ~76 GB before the port opens
      start_period: 3h
      retries: 3
  gpu-exporter:
    <<: *common
    image: ${GPU_IMAGE:-utkuozdemir/nvidia_gpu_exporter:latest}
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports:
      - 127.0.0.1:9835:9835
  otel:
    <<: *common
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    command: [--config=/etc/otel.yaml]
    volumes:
      - ./otel.yaml:/etc/otel.yaml:ro
    ports:
      - 127.0.0.1:8889:8889
    depends_on: [tempo]
  prometheus:
    <<: *common
    image: ${PROM_IMAGE:-prom/prometheus:latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    # Second network only so the scraper can reach the isolated Qwen-Image UC service.
    networks: [default, qwen-image-uc]
  tempo:
    <<: *common
    image: ${TEMPO_IMAGE:-grafana/tempo:2.9.0}
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  grafana:
    <<: *common
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run bash prepare.sh first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3055:3000"
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.6.13}
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.19.2}
    restart: unless-stopped
    user: '0:0'
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      LOG_PROJECT: ${COMPOSE_PROJECT_NAME:-ml-local}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
networks:
  default:
  qwen-image-uc:
  agent:
  agent-uc:
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
  loki-data:
  alloy-data:
