name: ml-local
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
# PI WEB services share one image (built by piweb-sessiond) and the same /data, workspace and projects.
x-piweb: &piweb
  <<: *common
  profiles: ["piweb"]
  image: local/ml-piweb:1
  init: false
  user: "${PIWEB_UID:-${SDXL_UID:-1000}}:${PIWEB_GID:-${SDXL_GID:-1000}}"
  # The Docker socket is root-equivalent on the host; agents use it for the projects' own compose stacks.
  group_add: ["${PIWEB_DOCKER_GID:-0}"]
  environment:
    PIWEB_PROJECTS: ${PIWEB_PROJECTS:-${HOME}/git}
    PI_TELEMETRY: '0'
  volumes:
    - ./outputs/piweb/data:/data
    - ./piweb/models.json:/etc/pi-web/models.json:ro
    - ${PIWEB_WORKSPACE:-./outputs/piweb/workspace}:/workspace
    # Same path as on the host, so bind mounts in the projects' compose files resolve via the socket.
    - ${PIWEB_PROJECTS:-${HOME}/git}:${PIWEB_PROJECTS:-${HOME}/git}
    - /var/run/docker.sock:/var/run/docker.sock
services:
  qwen-image:
    <<: *common
    profiles: ["qwen-image"]
    build:
      context: ./qwen-image
    image: local/ml-qwen-image:1
    init: true
    user: "${QWEN_IMAGE_UID:-${SDXL_UID:-1000}}:${QWEN_IMAGE_GID:-${SDXL_GID:-1000}}"
    stop_grace_period: 75s
    environment:
      CUDA_VISIBLE_DEVICES: ${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}},${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}
      NVIDIA_VISIBLE_DEVICES: ${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}},${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QWEN_IMAGE_VRAM_RESERVE_GIB: ${QWEN_IMAGE_VRAM_RESERVE_GIB:-1.5}
      QWEN_IMAGE_DIT: ${QWEN_IMAGE_DIT:-base}
    gpus: all
    volumes:
      - ./models/qwen-image-2.1:/models:ro
      - ./outputs/qwen-image:/data
    ports:
      - "127.0.0.1:8083:8188"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 120s
      retries: 4
  qwen-image-uc:
    <<: *common
    profiles: ["qwen-image-uc"]
    build:
      context: ./qwen-image-uc
      additional_contexts:
        qwenimage: ./qwen-image
    image: local/ml-qwen-image-uc:1
    init: true
    user: "${QWEN_IMAGE_UID:-${SDXL_UID:-1000}}:${QWEN_IMAGE_GID:-${SDXL_GID:-1000}}"
    stop_grace_period: 75s
    environment:
      # QWEN_IMAGE_UC_SHARED=1 (make uc-bonsai): text encoder on the second GPU instead of the CPU and fixed
      # VRAM caps on both GPUs, so bonsai-mtp fits next to it. See QWEN-IMAGE-UC-RU.md.
      CUDA_VISIBLE_DEVICES: ${QWEN_IMAGE_UC_GPU:-${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}}}${QWEN_IMAGE_UC_SHARED:+,${QWEN_IMAGE_UC_ENCODER_GPU:-${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}}}
      NVIDIA_VISIBLE_DEVICES: ${QWEN_IMAGE_UC_GPU:-${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}}}${QWEN_IMAGE_UC_SHARED:+,${QWEN_IMAGE_UC_ENCODER_GPU:-${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}}}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QWEN_IMAGE_UC_VRAM_RESERVE_GIB: ${QWEN_IMAGE_UC_VRAM_RESERVE_GIB:-1.5}
      QWEN_IMAGE_UC_ENCODER_DEVICE: ${QWEN_IMAGE_UC_SHARED:+gpu}
      QWEN_IMAGE_UC_VRAM_GIB: ${QWEN_IMAGE_UC_SHARED:+${QWEN_IMAGE_UC_VRAM_GIB:-7.25}}
      QWEN_IMAGE_UC_ENCODER_VRAM_GIB: ${QWEN_IMAGE_UC_ENCODER_VRAM_GIB:-7.75}
    gpus: all
    # Own network only: other services (the Telegram bot included) cannot resolve or reach it.
    networks: [qwen-image-uc]
    volumes:
      - ./models/qwen-image-2.1-uc:/models:ro
      - ./outputs/qwen-image-uc:/data
    ports:
      - "127.0.0.1:8085:8188"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 120s
      retries: 4
  tgbot:
    <<: *common
    build:
      context: ./tgbot
    image: local/ml-tgbot:1
    init: true
    user: "${TGBOT_UID:-${SDXL_UID:-1000}}:${TGBOT_GID:-${SDXL_GID:-1000}}"
    environment:
      TGBOT_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      TGBOT_TOKEN: ${TGBOT_TOKEN:-}
      TGBOT_ADMINS: ${TGBOT_ADMINS:-}
      # Point the bot at the torrent service; set TGBOT_TORRENT_URL= in .env to disable /magnet.
      TGBOT_TORRENT_URL: ${TGBOT_TORRENT_URL:-http://torrent:8080}
      # Outlives TORRENT_METADATA_TIMEOUT on the torrent side; see torrents.py.
      TGBOT_TORRENT_METADATA_TIMEOUT: ${TGBOT_TORRENT_METADATA_TIMEOUT:-240}
      # Point the bot at the market scraper; set TGBOT_SCRAPER_URL= in .env to disable /query, /watch, ...
      TGBOT_SCRAPER_URL: ${TGBOT_SCRAPER_URL:-http://scraper:8080}
    volumes:
      - ./outputs/tgbot:/data
      - ./qwen-image/workflows:/workflows:ro
    ports:
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  scraper:
    <<: *common
    build:
      context: ./scraper
    image: local/ml-scraper:1
    init: true
    user: "${SCRAPER_UID:-${SDXL_UID:-1000}}:${SCRAPER_GID:-${SDXL_GID:-1000}}"
    environment:
      # One admin key for the whole stack: it guards both the scraper API and tgbot /api/notify.
      SCRAPER_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      SCRAPER_TGBOT_URL: http://tgbot:8080
      SCRAPER_INTERVAL: ${SCRAPER_INTERVAL:-900}
      SCRAPER_DELAY: ${SCRAPER_DELAY:-1.0}
      SCRAPER_REPORT_HOUR: ${SCRAPER_REPORT_HOUR:-10}
    volumes:
      - ./outputs/scraper:/data
    ports:
      - "127.0.0.1:8086:8080"
    depends_on: [tgbot]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  torrent:
    <<: *common
    build:
      context: ./torrent
    image: local/ml-torrent:1
    init: true
    user: "${TORRENT_UID:-${SDXL_UID:-1000}}:${TORRENT_GID:-${SDXL_GID:-1000}}"
    environment:
      # The single admin key guards the torrent API; the service uses it to push to tgbot too.
      TORRENT_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      TORRENT_TGBOT_URL: http://tgbot:8080
      TORRENT_DESTINATION: /data/downloads
      TORRENT_METADATA_TIMEOUT: ${TORRENT_METADATA_TIMEOUT:-180}
    volumes:
      - ./outputs/torrent:/data
    ports:
      - "127.0.0.1:8087:8080"
    depends_on: [tgbot]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  # PI WEB: web UI for Pi Coding Agent on the local LLMs (piweb/models.json). Agent sessions live
  # in piweb-sessiond; piweb is the browser UI on :8504. See PIWEB-RU.md.
  piweb-sessiond:
    <<: *piweb
    command: ["pi-web-sessiond"]
    stop_grace_period: 30s
    build:
      context: ./piweb
      args:
        PIWEB_UID: ${PIWEB_UID:-${SDXL_UID:-1000}}
        PIWEB_GID: ${PIWEB_GID:-${SDXL_GID:-1000}}
    healthcheck:
      test: ["CMD", "test", "-S", "/data/pi-web/sessiond.sock"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
  piweb:
    <<: *piweb
    command: ["pi-web-server"]
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:8504:8504"
    depends_on:
      piweb-sessiond:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8504/api/pi-web/runtime"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
  sdxl:
    <<: *common
    profiles: ["sdxl"]
    build:
      context: ./sdxl
      args:
        SDXL_BASE_IMAGE: ${SDXL_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime@sha256:c16f4c749e2d9e96878875cdf6cc45cddda1d1a36fddd371dd6f2360f1b6e2a2}
    image: local/ml-sdxl:1
    init: true
    user: "${SDXL_UID:-1000}:${SDXL_GID:-1000}"
    stop_grace_period: 75s
    environment:
      SDXL_MODE: single
      CUDA_VISIBLE_DEVICES: ${SDXL_GPU0:-0}
      NVIDIA_VISIBLE_DEVICES: ${SDXL_GPU0:-0}
      SDXL_QUEUE_SIZE: ${SDXL_QUEUE_SIZE:-4}
      SDXL_MAX_RESULTS: ${SDXL_MAX_RESULTS:-100}
      SDXL_RETENTION_HOURS: ${SDXL_RETENTION_HOURS:-168}
      SDXL_VAE_TILING: ${SDXL_VAE_TILING:-1}
      SDXL_VRAM_RESERVE_GIB: ${SDXL_VRAM_RESERVE_GIB:-1.5}
      SDXL_GPU0_BUDGET: ${SDXL_GPU0_BUDGET:-11GiB}
      SDXL_GPU1_BUDGET: ${SDXL_GPU1_BUDGET:-9GiB}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SDXL_GPU0:-0}"]
              capabilities: [gpu]
    volumes:
      - ./models/sdxl-base-1.0:/models:ro
      - ./outputs/sdxl:/outputs
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 180s
      retries: 4
  qwen:
    <<: *common
    profiles: ["qwen"]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1}
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8080:8080
    command:
      - --model
      - /models/${QWEN_MODEL_FILE:-Qwen3.8-27B-UD-Q4_K_M.gguf}
      - --alias
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --device
      - CUDA0,CUDA1
      - --gpu-layers
      - all
      - --override-tensor
      - 'token_embd\.weight=CUDA0'
      - --fit
      - 'off'
      - --split-mode
      - layer
      - --tensor-split
      - ${QWEN_TENSOR_SPLIT:-0.60,0.40}
      - --ctx-size
      - ${QWEN_CTX_SIZE:-196608}
      # The model file carries an MTP head (blk.64.nextn): lossless speculative decoding.
      - --spec-type
      - ${QWEN_SPEC_TYPE:-draft-mtp}
      - --spec-draft-n-max
      - ${QWEN_SPEC_DRAFT_N_MAX:-2}
      - --parallel
      - '1'
      - --flash-attn
      - 'on'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-type-k-draft
      - q8_0
      - --cache-type-v-draft
      - q8_0
      # Host-RAM prompt cache and recurrent-state checkpoints: a diverged history
      # resumes from the nearest checkpoint instead of a full prefill.
      - --cache-ram
      - ${QWEN_CACHE_RAM:-4096}
      - --ctx-checkpoints
      - ${QWEN_CTX_CHECKPOINTS:-8}
      - --batch-size
      - '2048'
      - --ubatch-size
      - ${QWEN_UBATCH_SIZE:-256}
      - --threads
      - '4'
      - --poll
      - '0'
      - --jinja
      - --metrics
      - --sleep-idle-seconds
      - '-1'
  qwen-mtp:
    # Same model class as qwen, but the RVN Q4_K_M multilingual build with the
    # embedded MTP head (speculative decoding). Uses its own QWEN_MTP_* variables;
    # tuned like qwen, fully in VRAM with MTP on, ~1 GiB headroom per GPU.
    <<: *common
    profiles: ["qwen-mtp"]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${QWEN_MTP_CUDA_VISIBLE_DEVICES:-${CUDA_VISIBLE_DEVICES:-0,1}}
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8081:8080
    command:
      - --model
      - /models/${QWEN_MTP_MODEL_FILE:-RVN-Q4_K_M-multilingual-mtp.gguf}
      - --alias
      - qwen3.8-27b-mtp
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --device
      - CUDA0,CUDA1
      - --gpu-layers
      - all
      - --override-tensor
      - 'token_embd\.weight=CUDA0'
      - --fit
      - 'off'
      - --split-mode
      - layer
      - --tensor-split
      - ${QWEN_MTP_TENSOR_SPLIT:-0.60,0.40}
      - --ctx-size
      - ${QWEN_MTP_CTX_SIZE:-163840}
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - ${QWEN_MTP_SPEC_DRAFT_N_MAX:-2}
      - --parallel
      - '1'
      - --flash-attn
      - 'on'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-type-k-draft
      - q8_0
      - --cache-type-v-draft
      - q8_0
      # Host-RAM prompt cache and recurrent-state checkpoints, as in qwen.
      - --cache-ram
      - ${QWEN_MTP_CACHE_RAM:-4096}
      - --ctx-checkpoints
      - ${QWEN_MTP_CTX_CHECKPOINTS:-8}
      - --batch-size
      - '2048'
      - --ubatch-size
      - ${QWEN_MTP_UBATCH_SIZE:-256}
      - --threads
      - '4'
      - --poll
      - '0'
      - --jinja
      - --metrics
      - --sleep-idle-seconds
      - '-1'
  bonsai-mtp:
    # Ternary-Bonsai-2-27B Uncensored (qwen35 hybrid, PQ2_0 ternary + MTP head).
    # Needs the PrismML llama.cpp fork, so it has its own image; see bonsai/Dockerfile.
    # ~8.1 GB of weights leave room for the native 256k context shared by all slots
    # (--kv-unified). Measured on 4070 Ti S + 3080 Ti: MTP n-max 2 beats 3 and 4;
    # 0.6,0.4 keeps >=1.2 GB free per GPU even with 4 slots; ubatch 1024 does not fit
    # at 256k. Single 3080 Ti is faster (BONSAI_MTP_CUDA_VISIBLE_DEVICES=1,
    # BONSAI_MTP_DEVICE=CUDA0, BONSAI_MTP_CTX_SIZE=65536, BONSAI_MTP_PARALLEL=1).
    <<: *common
    profiles: ["bonsai-mtp"]
    build:
      context: ./bonsai
    image: local/ml-bonsai:1
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${BONSAI_MTP_CUDA_VISIBLE_DEVICES:-${CUDA_VISIBLE_DEVICES:-0,1}}
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8089:8080
    command:
      - --model
      - /models/${BONSAI_MTP_MODEL_FILE:-Ternary-Bonsai-2-27B-Uncensored-Gaston-PQ2_0-MTP.gguf}
      - --alias
      - bonsai2-27b-uc-mtp
      - --device
      - ${BONSAI_MTP_DEVICE:-CUDA0,CUDA1}
      - --gpu-layers
      - all
      - --override-tensor
      - 'token_embd\.weight=CUDA0'
      - --fit
      - 'off'
      - --split-mode
      - layer
      - --tensor-split
      - ${BONSAI_MTP_TENSOR_SPLIT:-0.6,0.4}
      - --ctx-size
      - ${BONSAI_MTP_CTX_SIZE:-262144}
      - --parallel
      - ${BONSAI_MTP_PARALLEL:-2}
      - --kv-unified
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - ${BONSAI_MTP_SPEC_DRAFT_N_MAX:-2}
      - --flash-attn
      - 'on'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-type-k-draft
      - q8_0
      - --cache-type-v-draft
      - q8_0
      - --cache-ram
      - ${BONSAI_MTP_CACHE_RAM:-4096}
      - --ctx-checkpoints
      - ${BONSAI_MTP_CTX_CHECKPOINTS:-8}
      - --batch-size
      - '2048'
      - --ubatch-size
      - ${BONSAI_MTP_UBATCH_SIZE:-512}
      - --threads
      - '4'
      - --poll
      - '0'
      - --jinja
      - --metrics
      - --sleep-idle-seconds
      - '-1'
  gpu-exporter:
    <<: *common
    image: ${GPU_IMAGE:-utkuozdemir/nvidia_gpu_exporter:latest}
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports:
      - 127.0.0.1:9835:9835
  otel:
    <<: *common
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    command: [--config=/etc/otel.yaml]
    volumes:
      - ./otel.yaml:/etc/otel.yaml:ro
    ports:
      - 127.0.0.1:8889:8889
    depends_on: [tempo]
  prometheus:
    <<: *common
    image: ${PROM_IMAGE:-prom/prometheus:latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    # Second network only so the scraper can reach the isolated Qwen-Image UC service.
    networks: [default, qwen-image-uc]
  tempo:
    <<: *common
    image: ${TEMPO_IMAGE:-grafana/tempo:2.9.0}
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  grafana:
    <<: *common
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run bash prepare.sh first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3055:3000"
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.6.13}
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.19.2}
    restart: unless-stopped
    user: '0:0'
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      LOG_PROJECT: ${COMPOSE_PROJECT_NAME:-ml-local}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
networks:
  default:
  qwen-image-uc:
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
  loki-data:
  alloy-data:
