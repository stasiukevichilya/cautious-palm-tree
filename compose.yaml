# One Compose project (ml-local) assembled from the group files; manage it from here (Makefile, docker compose).
# Each group file's relative paths resolve from its own directory; variables come from this directory's .env.
name: ml-local
include:
  - path: observability/compose.yaml
    env_file: .env
  - path: llm/compose.yaml
    env_file: .env
  - path: imagegen/compose.yaml
    env_file: .env
  - path: agent/compose.yaml
    env_file: .env
  - path: services/compose.yaml
    env_file: .env
