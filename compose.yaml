name: ml-local
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  qwen-image:
    <<: *common
    profiles: ["qwen-image"]
    build:
      context: ./qwen-image
    image: local/ml-qwen-image:1
    init: true
    user: "${QWEN_IMAGE_UID:-${SDXL_UID:-1000}}:${QWEN_IMAGE_GID:-${SDXL_GID:-1000}}"
    stop_grace_period: 75s
    environment:
      CUDA_VISIBLE_DEVICES: ${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}},${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}
      NVIDIA_VISIBLE_DEVICES: ${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}},${QWEN_IMAGE_GPU1:-${SDXL_GPU1:-1}}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QWEN_IMAGE_VRAM_RESERVE_GIB: ${QWEN_IMAGE_VRAM_RESERVE_GIB:-1.5}
      QWEN_IMAGE_DIT: ${QWEN_IMAGE_DIT:-base}
    gpus: all
    volumes:
      - ./models/qwen-image-2.1:/models:ro
      - ./outputs/qwen-image:/data
    ports:
      - "127.0.0.1:8083:8188"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 120s
      retries: 4
  qwen-image-uc:
    <<: *common
    profiles: ["qwen-image-uc"]
    build:
      context: ./qwen-image-uc
      additional_contexts:
        qwenimage: ./qwen-image
    image: local/ml-qwen-image-uc:1
    init: true
    user: "${QWEN_IMAGE_UID:-${SDXL_UID:-1000}}:${QWEN_IMAGE_GID:-${SDXL_GID:-1000}}"
    stop_grace_period: 75s
    environment:
      CUDA_VISIBLE_DEVICES: ${QWEN_IMAGE_UC_GPU:-${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}}}
      NVIDIA_VISIBLE_DEVICES: ${QWEN_IMAGE_UC_GPU:-${QWEN_IMAGE_GPU0:-${SDXL_GPU0:-0}}}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QWEN_IMAGE_UC_VRAM_RESERVE_GIB: ${QWEN_IMAGE_UC_VRAM_RESERVE_GIB:-1.5}
    gpus: all
    # Own network only: other services (the Telegram bot included) cannot resolve or reach it.
    networks: [qwen-image-uc]
    volumes:
      - ./models/qwen-image-2.1-uc:/models:ro
      - ./outputs/qwen-image-uc:/data
    ports:
      - "127.0.0.1:8085:8188"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 120s
      retries: 4
  tgbot:
    <<: *common
    build:
      context: ./tgbot
    image: local/ml-tgbot:1
    init: true
    user: "${TGBOT_UID:-${SDXL_UID:-1000}}:${TGBOT_GID:-${SDXL_GID:-1000}}"
    environment:
      TGBOT_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      TGBOT_TOKEN: ${TGBOT_TOKEN:-}
      TGBOT_ADMINS: ${TGBOT_ADMINS:-}
      # Point the bot at the torrent service; set TGBOT_TORRENT_URL= in .env to disable /magnet.
      TGBOT_TORRENT_URL: ${TGBOT_TORRENT_URL:-http://torrent:8080}
      # Outlives TORRENT_METADATA_TIMEOUT on the torrent side; see torrents.py.
      TGBOT_TORRENT_METADATA_TIMEOUT: ${TGBOT_TORRENT_METADATA_TIMEOUT:-240}
      # Point the bot at the market scraper; set TGBOT_SCRAPER_URL= in .env to disable /query, /watch, ...
      TGBOT_SCRAPER_URL: ${TGBOT_SCRAPER_URL:-http://scraper:8080}
    volumes:
      - ./outputs/tgbot:/data
      - ./qwen-image/workflows:/workflows:ro
    ports:
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  scraper:
    <<: *common
    build:
      context: ./scraper
    image: local/ml-scraper:1
    init: true
    user: "${SCRAPER_UID:-${SDXL_UID:-1000}}:${SCRAPER_GID:-${SDXL_GID:-1000}}"
    environment:
      # One admin key for the whole stack: it guards both the scraper API and tgbot /api/notify.
      SCRAPER_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      SCRAPER_TGBOT_URL: http://tgbot:8080
      SCRAPER_INTERVAL: ${SCRAPER_INTERVAL:-900}
      SCRAPER_DELAY: ${SCRAPER_DELAY:-1.0}
      SCRAPER_REPORT_HOUR: ${SCRAPER_REPORT_HOUR:-10}
    volumes:
      - ./outputs/scraper:/data
    ports:
      - "127.0.0.1:8086:8080"
    depends_on: [tgbot]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  torrent:
    <<: *common
    build:
      context: ./torrent
    image: local/ml-torrent:1
    init: true
    user: "${TORRENT_UID:-${SDXL_UID:-1000}}:${TORRENT_GID:-${SDXL_GID:-1000}}"
    environment:
      # The single admin key guards the torrent API; the service uses it to push to tgbot too.
      TORRENT_ADMIN_KEY: ${TGBOT_ADMIN_KEY:-}
      TORRENT_TGBOT_URL: http://tgbot:8080
      TORRENT_DESTINATION: /data/downloads
      TORRENT_METADATA_TIMEOUT: ${TORRENT_METADATA_TIMEOUT:-180}
    volumes:
      - ./outputs/torrent:/data
    ports:
      - "127.0.0.1:8087:8080"
    depends_on: [tgbot]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
  sdxl:
    <<: *common
    profiles: ["sdxl"]
    build:
      context: ./sdxl
      args:
        SDXL_BASE_IMAGE: ${SDXL_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime@sha256:c16f4c749e2d9e96878875cdf6cc45cddda1d1a36fddd371dd6f2360f1b6e2a2}
    image: local/ml-sdxl:1
    init: true
    user: "${SDXL_UID:-1000}:${SDXL_GID:-1000}"
    stop_grace_period: 75s
    environment:
      SDXL_MODE: single
      CUDA_VISIBLE_DEVICES: ${SDXL_GPU0:-0}
      NVIDIA_VISIBLE_DEVICES: ${SDXL_GPU0:-0}
      SDXL_QUEUE_SIZE: ${SDXL_QUEUE_SIZE:-4}
      SDXL_MAX_RESULTS: ${SDXL_MAX_RESULTS:-100}
      SDXL_RETENTION_HOURS: ${SDXL_RETENTION_HOURS:-168}
      SDXL_VAE_TILING: ${SDXL_VAE_TILING:-1}
      SDXL_VRAM_RESERVE_GIB: ${SDXL_VRAM_RESERVE_GIB:-1.5}
      SDXL_GPU0_BUDGET: ${SDXL_GPU0_BUDGET:-11GiB}
      SDXL_GPU1_BUDGET: ${SDXL_GPU1_BUDGET:-9GiB}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SDXL_GPU0:-0}"]
              capabilities: [gpu]
    volumes:
      - ./models/sdxl-base-1.0:/models:ro
      - ./outputs/sdxl:/outputs
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 180s
      retries: 4
  qwen:
    <<: *common
    profiles: ["qwen"]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1}
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8080:8080
    command:
      - --model
      - /models/${QWEN_MODEL_FILE:-Qwen3.8-27B-UD-Q4_K_M.gguf}
      - --alias
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --device
      - CUDA0,CUDA1
      - --gpu-layers
      - all
      - --override-tensor
      - 'token_embd\.weight=CUDA0'
      - --fit
      - 'off'
      - --split-mode
      - layer
      - --tensor-split
      - ${QWEN_TENSOR_SPLIT:-0.57,0.43}
      - --ctx-size
      - ${QWEN_CTX_SIZE:-196608}
      - --parallel
      - '1'
      - --flash-attn
      - 'on'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --cache-ram
      - '0'
      - --ctx-checkpoints
      - '0'
      - --batch-size
      - '2048'
      - --ubatch-size
      - ${QWEN_UBATCH_SIZE:-64}
      - --threads
      - '4'
      - --poll
      - '0'
      - --jinja
      - --metrics
      - --sleep-idle-seconds
      - '-1'
  dsh:
    <<: *common
    build:
      context: ./dsh
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        DSH_VERSION: ${DSH_VERSION:?Run bash prepare.sh first}
    image: local/ml-dsh:${DSH_VERSION}
    init: true
    environment:
      DSH_HOME: /home/node/.dsh
      OTEL_SERVICE_NAME: dsh-agent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    volumes:
      - dsh-data:/home/node/.dsh
      - ./workspace:/workspace
    working_dir: /workspace
    ports:
      - 127.0.0.1:3080:3081
    command: [dsh, web, --no-open, --host, 127.0.0.1, --port, '3080']
    depends_on: [otel]
  dsh-forward:
    <<: *common
    image: ${SOCAT_IMAGE:-alpine/socat:latest}
    network_mode: service:dsh
    command: ['TCP-LISTEN:3081,fork,reuseaddr,bind=0.0.0.0', 'TCP:127.0.0.1:3080']
    depends_on: [dsh]
  gpu-exporter:
    <<: *common
    image: ${GPU_IMAGE:-utkuozdemir/nvidia_gpu_exporter:latest}
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports:
      - 127.0.0.1:9835:9835
  otel:
    <<: *common
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    command: [--config=/etc/otel.yaml]
    volumes:
      - ./otel.yaml:/etc/otel.yaml:ro
    ports:
      - 127.0.0.1:8889:8889
    depends_on: [tempo]
  prometheus:
    <<: *common
    image: ${PROM_IMAGE:-prom/prometheus:latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    # Second network only so the scraper can reach the isolated Qwen-Image UC service.
    networks: [default, qwen-image-uc]
  tempo:
    <<: *common
    image: ${TEMPO_IMAGE:-grafana/tempo:2.9.0}
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  grafana:
    <<: *common
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run bash prepare.sh first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3055:3000"
#  grafana-forward:
#    image: ${SOCAT_IMAGE:-alpine/socat:latest}
#    restart: unless-stopped
#    depends_on:
#      - grafana
#    ports:
#      - "127.0.0.1:3055:3055"
#    command:
#      - "TCP-LISTEN:3055,fork,reuseaddr,bind=0.0.0.0"
#      - "TCP:grafana:3000"
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.6.13}
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.19.2}
    restart: unless-stopped
    user: '0:0'
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      LOG_PROJECT: ${COMPOSE_PROJECT_NAME:-ml-local}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
networks:
  default:
  qwen-image-uc:
volumes:
  dsh-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  loki-data:
  alloy-data:
