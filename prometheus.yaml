global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: sdxl
    static_configs:
      - targets: ['sdxl:8080']

  - job_name: tgbot
    static_configs:
      - targets: ['tgbot:8080']

  - job_name: scraper
    static_configs:
      - targets: ['scraper:8080']

  - job_name: torrent
    static_configs:
      - targets: ['torrent:8080']

  - job_name: qwen-image
    metrics_path: /local-qwen-image/metrics
    static_configs:
      - targets: ['qwen-image:8188']

  - job_name: qwen-image-uc
    metrics_path: /local-qwen-image-uc/metrics
    static_configs:
      - targets: ['qwen-image-uc:8188']

  - job_name: qwen
    static_configs:
      - targets: ['qwen:8080']

  - job_name: qwen-mtp
    static_configs:
      - targets: ['qwen-mtp:8080']

  - job_name: bonsai-mtp
    static_configs:
      - targets: ['bonsai-mtp:8080']

  - job_name: gpu
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['gpu-exporter:9835']

  - job_name: otel
    static_configs:
      - targets: ['otel:8889']
