services:
  sdxl:
    environment:
      SDXL_MODE: dual
      CUDA_VISIBLE_DEVICES: ${SDXL_GPU0:-0},${SDXL_GPU1:-1}
      NVIDIA_VISIBLE_DEVICES: ${SDXL_GPU0:-0},${SDXL_GPU1:-1}
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids:
                - ${SDXL_GPU0:-0}
                - ${SDXL_GPU1:-1}
              capabilities: [gpu]
