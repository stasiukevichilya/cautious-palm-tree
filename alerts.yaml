groups:
  - name: local-inference
    rules:
      - alert: ScrapeTargetDown
        expr: up{job!~"llama|qwen|sdxl|tgbot|qwen-image|qwen-image-uc|torrent"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 'Metrics endpoint unavailable: {{ $labels.job }}'
      - alert: TorrentDestinationLow
        expr: torrent_destination_free_bytes / torrent_destination_total_bytes < 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Less than 5% of free space left in the torrent destination'
      - alert: LlamaQueueWaiting
        expr: llamacpp:requests_deferred > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Llama requests have been queued for over 10 minutes
      - alert: SdxlNotReady
        expr: (sdxl_ready == 0) and on(job, instance) (up{job="sdxl"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SDXL is running but not ready
      - alert: SdxlQueueWaiting
        expr: sdxl_queue_depth > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SDXL jobs have been queued for over 10 minutes
      - alert: TgbotNotPolling
        expr: (tgbot_polling == 0) and on(job, instance) (up{job="tgbot"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Telegram bot is running but not polling (no or invalid token)
